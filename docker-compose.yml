services:
  db:
    image: postgres:17-alpine
    container_name: linkedin-search-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkedin_search
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linkedin_search"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: